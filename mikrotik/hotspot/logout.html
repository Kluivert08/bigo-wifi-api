<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion - Bigo Wifi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(145deg, #2e1065 0%, #1e1035 50%, #0d061a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .box {
            background: #fff;
            padding: 36px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.45), 0 0 30px rgba(139, 92, 246, 0.25);
            max-width: 380px;
            width: 100%;
        }
        h2 { color: #1e1b4b; margin-bottom: 12px; font-weight: 800; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(109, 40, 217, 0.35);
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Déconnexion Réussie</h2>
        <p>Votre session a été fermée avec succès. Vous pouvez vous reconnecter à tout moment avec votre ticket s'il vous reste du temps.</p>
        <a href="$(link-login)" class="btn">Se Reconnecter</a>
    </div>
</body>
</html>
