# fly.toml app configuration file for Sixif / Bigo Wifi API
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'bigo-wifi-api'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Empêche l'arrêt complet de la machine pour éviter les cold-starts
  # et garantir que les requêtes MikroTik (/sync_mikrotik) et le portail captif répondent instantanément
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
