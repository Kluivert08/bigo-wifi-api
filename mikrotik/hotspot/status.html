<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bigo Wifi - Statut de Connexion</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --secondary: #1e1b4b;
            --success: #10b981;
            --card-bg: #ffffff;
            --text-main: #1e1b4b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #2e1065 0%, #1e1035 50%, #0d061a 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.45), 0 0 30px rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 26px;
            text-align: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ecfdf5;
            color: var(--success);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 16px;
            border: 1px solid #bbf7d0;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .user-code {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
            text-align: left;
        }

        .stat-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 800;
            color: var(--secondary);
            margin-top: 4px;
        }

        .btn-disconnect {
            display: block;
            width: 100%;
            padding: 13px;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-disconnect:hover {
            background: #fecaca;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .footer strong {
            color: #c4b5fd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="status-badge">
            <span class="pulse-dot"></span> Connecté à Internet
        </div>

        <div class="user-code">Ticket : $(username)</div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">Temps Connecté</div>
                <div class="stat-value">$(uptime)</div>
            </div>

            <div class="stat-item">
                <div class="stat-label">Temps Restant</div>
                <div class="stat-value">$(session-time-left)</div>
            </div>

            <div class="stat-item">
                <div class="stat-label">Téléchargement (In)</div>
                <div class="stat-value">$(bytes-in-nice)</div>
            </div>

            <div class="stat-item">
                <div class="stat-label">Envoi (Out)</div>
                <div class="stat-value">$(bytes-out-nice)</div>
            </div>
        </div>

        <form action="$(link-logout)" name="logout" onSubmit="return openLogout()">
            <input type="hidden" name="erase-cookie" value="on">
            <button type="submit" class="btn-disconnect">Se Déconnecter</button>
        </form>
    </div>

    <div class="footer">
        Propulsé par <strong>Sixif Networks</strong> • Bigo Wifi Zone
    </div>
</div>

</body>
</html>
