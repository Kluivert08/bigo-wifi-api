<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion - Bigo Wifi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            max-width: 380px;
        }
        h2 { color: #0f172a; margin-bottom: 10px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Déconnexion Réussie</h2>
        <p>Votre session a été fermée avec succès. Vous pouvez vous reconnecter à tout moment avec votre ticket s'il reste du temps.</p>
        <a href="$(link-login)" class="btn">Se Reconnecter</a>
    </div>
</body>
</html>
